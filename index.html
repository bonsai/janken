<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1B2A4A"><link rel="manifest" href="./manifest.json">
<title>janken.jev.js — POC</title>
<style>
:root{--bg:#1B2A4A;--ink:#FFF8E7;--pink:#FF5AAA;--cyan:#5AE6F0;--dim:#8A9BB8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--dim);font-size:13px;margin:0 0 18px}.panel{border:1px solid #2b3d63;border-radius:14px;padding:16px;margin:14px 0}
.earn-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.earn-head h2{margin:0}.earn-balance{font-size:30px;font-weight:800;color:var(--pink);white-space:nowrap}.earn-progress{display:flex;justify-content:space-between;margin-top:12px;color:var(--dim);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
select{width:100%;padding:10px;border-radius:9px;border:1px solid #2b3d63;background:#0f1a2e;color:var(--ink)}
button{font:inherit}.primary{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--pink);color:white;font-weight:700;cursor:pointer}
.status{display:flex;justify-content:space-between;gap:12px;margin:8px 0;font-size:13px}.status b{font-size:18px}
.hands{display:flex;gap:12px;margin:16px 0}.hand{flex:1;padding:18px 8px;border:2px solid var(--dim);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer}
.hand:hover{border-color:var(--cyan)}.row{display:flex;gap:12px;align-items:center;margin:8px 0}.k{width:70px;color:var(--dim);font-size:13px}.big{font-size:28px;font-weight:700}
.bar{height:8px;background:#0f1a2e;border-radius:4px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}
.reason{color:var(--dim);font-size:13px}.need{color:var(--pink);font-size:13px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.score{border:1px solid #2b3d63;border-radius:10px;padding:8px 10px;font-size:13px}.score b{display:block;font-size:18px}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #2b3d63}th{color:var(--dim);font-weight:400}
.hidden{display:none}.nav{display:flex;gap:8px;margin:14px 0}.nav button{flex:1;padding:10px;border:1px solid #2b3d63;border-radius:10px;background:#0f1a2e;color:var(--ink);cursor:pointer}.nav button.active{border-color:var(--cyan);color:var(--cyan)}footer{color:var(--dim);font-size:12px;margin-top:24px}code{background:#0f1a2e;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<main>
<h1>janken.jev.js</h1>
<p class="lead">SPA PWA: profile → game → behavior data.</p>

<nav class="nav" aria-label="App navigation">
<button id="navGame" class="active">Game</button>
<button id="navProfile">Profile</button>
</nav>

<section id="gamePanel" class="panel">
<div class="status"><span>Balance</span><b>¥<span id="balance">0</span></b></div>
<div class="status"><span>Rounds</span><b><span id="rounds">0</span>/10</b></div>
<div class="hands">
<button class="hand" data-hand="rock">Rock</button>
<button class="hand" data-hand="scissors">Scissors</button>
<button class="hand" data-hand="paper">Paper</button>
</div>
<div class="row"><span class="k">You</span><span class="big" id="you">—</span><span class="k">AI</span><span class="big" id="ai">—</span><span class="big" id="result" style="margin-left:auto">—</span></div>
<div class="row"><span class="k">Reason</span><span class="reason" id="reason">—</span></div>
<div class="row"><span class="k">Confidence</span><span class="bar"><i id="confbar" style="width:0%"></i></span><span id="conf">0.00</span></div>
<div class="row"><span class="k"></span><span class="need" id="need"></span></div>
<div class="scores" id="scores"></div>
<table><thead><tr><th>#</th><th>You</th><th>AI</th><th>Result</th><th>Local tendency</th></tr></thead><tbody id="log"></tbody></table>
<button id="continue" class="primary hidden">Continue +10 rounds</button>
</section>

<section id="profilePanel" class="panel hidden">
<div class="earn-head"><div><h2>Profile</h2><p class="lead">Each completed field adds ¥100. Up to 6 fields.</p></div><div class="earn-balance">¥<span id="profileBalance">0</span></div></div>
<div class="grid">
<div class="field"><label>Age</label><select id="age_group"><option value="">—</option><option value="under_20">Under 20</option><option value="20_29">20–29</option><option value="30_39">30–39</option><option value="40_49">40–49</option><option value="50_59">50–59</option><option value="60_plus">60+</option></select></div>
<div class="field"><label>Gender</label><select id="gender"><option value="">—</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option><option value="prefer_not_to_say">Prefer not to say</option></select></div>
<div class="field"><label>Region</label><select id="region"><option value="">—</option><option value="hokkaido">Hokkaido</option><option value="tohoku">Tohoku</option><option value="kanto">Kanto</option><option value="hokuriku_koshinetsu">Hokuriku/Koshinetsu</option><option value="tokai">Tokai</option><option value="kinki">Kinki</option><option value="chugoku">Chugoku</option><option value="shikoku">Shikoku</option><option value="kyushu_okinawa">Kyushu/Okinawa</option></select></div>
<div class="field"><label>Handedness</label><select id="handedness"><option value="">—</option><option value="right">Right</option><option value="left">Left</option><option value="ambidextrous">Ambidextrous</option></select></div>
<div class="field"><label>Occupation</label><select id="occupation"><option value="">—</option><option value="student">Student</option><option value="employed">Employed</option><option value="self_employed">Self-employed</option><option value="other">Other</option></select></div>
<div class="field"><label>Experience</label><select id="experience"><option value="">—</option><option value="beginner">Beginner</option><option value="casual">Casual</option><option value="experienced">Experienced</option></select></div>
</div>
<div class="earn-progress"><span id="profileProgress">0/6</span><span>max ¥600</span></div>
<button id="start" class="primary" disabled>Start game</button>
</section>

<footer>POC is frontend-only. Data stays in the browser for now. API, ads, and BQML are next.</footer>
</main>
<script src="./janken.jev.js"></script>
<script src="./en2ja.js"></script>
<script>
const {JankenJev,JANKEN_HANDS:HANDS,JANKEN_JUDGE:judgeRound,JANKEN_HUMAN_THRESHOLD:HUMAN_THRESHOLD}=globalThis;
const ai=new JankenJev({window:6}); const $=id=>document.getElementById(id);
let round=0,balance=0,profileBalance=0,sessionId=crypto.randomUUID(),jsonl=[];
const rewardedFields=new Set();
const profileFields=["age_group","gender","region","handedness","occupation","experience"];

function append(event){jsonl.push(JSON.stringify({...event,session_id:sessionId,timestamp:new Date().toISOString()}));}
function pct(v){return Math.round(v*100)+"%";}
function renderScores(scores){$("scores").innerHTML=HANDS.map(h=>'<div class="score"><span class="reason">'+en2ja(h)+'</span><b>'+((scores?.[h]??0).toFixed(2))+'</b></div>').join("");}
function updateProfileReward(field){
  const value=$(field).value;
  if(!value || rewardedFields.has(field)) return;
  rewardedFields.add(field);
  profileBalance += 100;
  balance = profileBalance;
  $("profileBalance").textContent=profileBalance;
  $("profileProgress").textContent=rewardedFields.size+"/6";
  $("balance").textContent=balance;
  $("start").disabled=false;
  append({event:"profile_field",field,value,reward:100,currency:"jpy",profile_balance:profileBalance});
}
function startGame(){
  const profile=Object.fromEntries(profileFields.map(k=>[k,$(k).value]).filter(([,v])=>v));
  append({event:"profile",profile,profile_field_count:Object.keys(profile).length});
  $("profilePanel").classList.add("hidden"); $("gamePanel").classList.remove("hidden");
  $("balance").textContent=balance;
}

function play(you){
  if(round>=10)return;
  const d=ai.play(),res=judgeRound(you,d.hand);
  if(res==="あいこ") {
    $("you").textContent=en2ja(you); $("ai").textContent=en2ja(d.hand); $("result").textContent=en2ja("draw");
    append({event:"round_attempt",round:round+1,attempt:1,player_hand:you,ai_hand:d.hand,result:"draw"});
    return;
  }
  round++; balance += res==="勝ち"?10:-10;
  $("you").textContent=en2ja(you); $("ai").textContent=en2ja(d.hand); $("result").textContent=en2ja(res==="勝ち"?"win":"lose");
  $("reason").textContent=d.reason; $("conf").textContent=d.confidence.toFixed(2); $("confbar").style.width=pct(d.confidence);
  $("need").textContent=d.needsHuman?("Confidence < "+HUMAN_THRESHOLD):"";
  renderScores(d.scores); $("balance").textContent=balance; $("rounds").textContent=round;
  ai.observe(you);
  const t=ai.tendency(),tr=document.createElement("tr"); tr.innerHTML='<td>'+round+'</td><td>'+en2ja(you)+'</td><td>'+en2ja(d.hand)+'</td><td>'+en2ja(res==="勝ち"?"win":"lose")+'</td><td class="reason">'+HANDS.map(h=>en2ja(h)+":"+pct(t[h])).join(" ")+"</td>"; $("log").prepend(tr);
  append({event:"round",round,attempt:1,player_hand:you,ai_hand:d.hand,result:res==="勝ち"?"win":"lose",stake:10,payout:res==="勝ち"?20:0,balance});
  if(round>=10){document.querySelectorAll(".hand").forEach(b=>b.disabled=true);$("continue").classList.remove("hidden");}
}
function continueGame(){round=0;document.querySelectorAll(".hand").forEach(b=>b.disabled=false);$("continue").classList.add("hidden");$("rounds").textContent="0";append({event:"continue_offer",rounds:10});}
profileFields.forEach(field => $(field).addEventListener("change", () => updateProfileReward(field)));
$("start").addEventListener("click",startGame);$("continue").addEventListener("click",continueGame);
document.querySelectorAll(".hand").forEach(b=>b.addEventListener("click",()=>play(b.dataset.hand)));
</script>
</body>
</html>
